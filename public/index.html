<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💀 Bulk Messenger Panel</title>
    <style>
        :root { --bg: #0a0a0a; --card: #141414; --border: #2a2a2a; --text: #e0e0e0; --accent: #ff0033; --green: #00cc66; --red: #ff3333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; min-height: 100vh; }
        .container { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; width: 100%; max-width: 800px; box-shadow: 0 0 40px rgba(255, 0, 51, 0.1); }
        
        .header-area { text-align: center; margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; }
        .header-area img { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; margin-bottom: 15px; border: 3px solid var(--accent); box-shadow: 0 0 20px rgba(255, 0, 51, 0.6); }
        .header-area p { color: #888; font-size: 0.9em; letter-spacing: 2px; text-transform: uppercase; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.85em; font-weight: bold; }
        textarea, input, select { width: 100%; padding: 12px; background: #000; border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 14px; }
        textarea:focus, input:focus { outline: none; border-color: var(--accent); }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 15px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        #startBtn { background: var(--green); color: #000; }
        #stopBtn { background: var(--red); color: #fff; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .terminal { margin-top: 25px; background: #000; border: 1px solid #333; border-radius: 8px; padding: 15px; height: 250px; overflow-y: auto; font-size: 13px; }
        .log-line { margin-bottom: 4px; color: #bbb; }
        .log-success { color: var(--green); }
        .log-error { color: var(--red); }
        
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 15px; background: #1a1a1a; border-radius: 8px; border: 1px solid #333; }
        .badge { padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .badge.idle { background: #333; color: #aaa; }
        .badge.running { background: var(--green); color: #000; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-area">
            <img src="https://i.ibb.co/KjtjBDRP/file-00000000f49c821197fdc7fcda40847d.png" alt="Header Icon">
            <p>Messenger Bulk Sender</p>
        </div>

        <form id="senderForm">
            <div class="grid">
                <div class="full-width">
                    <label>🍪 Cookies (C3C JSON)</label>
                    <textarea id="cookies" name="cookies" rows="3" placeholder='[{"key":"c_user","value":"..."}, ...]' required></textarea>
                </div>
                
                <div>
                    <label>👥 Group UID</label>
                    <input type="text" id="thread_id" name="thread_id" placeholder="e.g. 1234567890" required>
                </div>

                <div>
                    <label>⏱️ Time Delay (Seconds)</label>
                    <input type="number" id="time_delay" name="time_delay" value="10" min="5" required>
                </div>

                <div class="full-width">
                    <label>🏷️ Here Name (Sender Name)</label>
                    <input type="text" id="sender_name" name="sender_name" placeholder="I am here" required>
                </div>

                <div class="full-width">
                    <label>📁 Upload Message File (.txt)</label>
                    <input type="file" id="message_file" name="message_file" accept=".txt" required>
                </div>
            </div>

            <div class="btn-group">
                <button type="button" id="startBtn">▶️ Run Server</button>
                <button type="button" id="stopBtn" disabled>⏹️ Stop Server</button>
            </div>
        </form>

        <div class="status-bar">
            <div>
                <span>Status: </span>
                <span id="statusBadge" class="badge idle">IDLE</span>
                <span id="statusText" style="margin-left:10px; font-size:13px; color:#888;">Waiting...</span>
            </div>
            <div>Sent: <span id="sentCount" style="color:var(--green)">0</span> | Failed: <span id="failCount" style="color:var(--red)">0</span></div>
        </div>

        <div class="terminal" id="terminal">
            <div class="log-line">> System ready. Waiting for input...</div>
        </div>
    </div>

    <script>
        const form = document.getElementById('senderForm');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const terminal = document.getElementById('terminal');
        let pollingInterval = null;

        function printLog(msg) {
            const div = document.createElement('div');
            div.className = 'log-line';
            if (msg.includes('✅') || msg.includes('🎉')) div.classList.add('log-success');
            if (msg.includes('❌') || msg.includes('🛑') || msg.includes('Failed')) div.classList.add('log-error');
            div.innerText = msg;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                const badge = document.getElementById('statusBadge');
                badge.className = `badge ${data.isRunning ? 'running' : 'idle'}`;
                badge.innerText = data.isRunning ? 'RUNNING' : 'IDLE';
                document.getElementById('statusText').innerText = data.status;
                document.getElementById('sentCount').innerText = data.totalSent;
                document.getElementById('failCount').innerText = data.totalFailed;

                if (data.logs && data.logs.length > 0) {
                    terminal.innerHTML = ''; 
                    data.logs.forEach(log => printLog(log));
                }

                startBtn.disabled = data.isRunning;
                stopBtn.disabled = !data.isRunning;
            } catch (err) {}
        }

        startBtn.addEventListener('click', async () => {
            if (!form.checkValidity()) { form.reportValidity(); return; }
            
            const formData = new FormData(form);
            terminal.innerHTML = '';
            startBtn.disabled = true;
            printLog("> Starting server...");

            try {
                const res = await fetch('/api/start', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (data.status === 'error') {
                    alert(data.message);
                    startBtn.disabled = false;
                    return;
                }
                
                if (!pollingInterval) pollingInterval = setInterval(checkStatus, 2000);
                checkStatus();
            } catch (err) {
                printLog("> ❌ Network Error.");
                startBtn.disabled = false;
            }
        });

        stopBtn.addEventListener('click', async () => {
            stopBtn.disabled = true;
            printLog("> Sending stop signal...");
            try { await fetch('/api/stop', { method: 'POST' }); } catch (e) {}
        });

        window.onload = () => {
            checkStatus();
            pollingInterval = setInterval(checkStatus, 5000);
        };
    </script>
</body>
</html>
