<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💀 Bulk Messenger Panel</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1e1e1e;
            --border: #333;
            --text: #eee;
            --accent: #e50914;
            --green: #28a745;
            --red: #dc3545;
            --yellow: #ffc107;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.15);
        }
        .header {
            text-align: center;
            font-size: 4em;
            margin-bottom: 8px;
            text-shadow: 0 0 25px var(--accent);
        }
        .subheader {
            text-align: center;
            color: #888;
            letter-spacing: 3px;
            font-size: 0.9em;
            margin-bottom: 28px;
            text-transform: uppercase;
        }
        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: 600;
            color: #aaa;
            font-size: 0.95em;
        }
        textarea, input[type="text"], input[type="number"], select, input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        textarea:focus, input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }
        textarea { resize: vertical; min-height: 100px; }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }
        button {
            flex: 1;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #startBtn { background: var(--green); color: #fff; }
        #startBtn:hover:not(:disabled) { background: #218838; }
        #stopBtn { background: var(--red); color: #fff; }
        #stopBtn:hover:not(:disabled) { background: #c82333; }
        #statusBox {
            margin-top: 24px;
            padding: 16px;
            background: #111;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #statusText { font-weight: 600; }
        #refreshBtn {
            background: #333;
            color: #ddd;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            flex: none;
            width: auto;
        }
        #refreshBtn:hover { background: #444; }
        .hint { font-size: 12px; color: #666; margin-top: 4px; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            margin-left: 6px;
        }
        .badge-running { background: var(--green); color: #fff; }
        .badge-stopped { background: #555; color: #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">💀</div>
        <div class="subheader">Bulk Messenger Panel</div>

        <form id="senderForm">
            <label for="cookies">🍪 Facebook Cookies (C3C JSON)</label>
            <textarea id="cookies" name="cookies" placeholder='[{"key":"c_user","value":"..."}, ...]' required></textarea>
            <div class="hint">C3C extension se copy kiya hua JSON yahan paste karein.</div>

            <label for="thread_id">👥 Group UID / IB (Thread ID)</label>
            <input type="text" id="thread_id" name="thread_id" placeholder="e.g. 1234567890" required>

            <label for="thread_type">📌 Thread Type</label>
            <select id="thread_type" name="thread_type">
                <option value="GROUP" selected>Group (Recommended)</option>
                <option value="USER">User (IB) - May fail due to E2E encryption</option>
            </select>

            <label for="message_file">📁 Message File (.txt)</label>
            <input type="file" id="message_file" name="message_file" accept=".txt" required>
            <div class="hint">Har line ek alag message hogi.</div>

            <label for="time_delay">⏱️ Time Delay (seconds)</label>
            <input type="number" id="time_delay" name="time_delay" value="10" min="5" required>

            <label for="sender_name">🏷️ Sender Name (Here Name)</label>
            <input type="text" id="sender_name" name="sender_name" placeholder="e.g. YourName" required>

            <div class="btn-group">
                <button type="button" id="startBtn">▶️ RUN</button>
                <button type="button" id="stopBtn">⏹️ STOP</button>
            </div>
        </form>

        <div id="statusBox">
            <span id="statusText">Status: Idle</span>
            <button id="refreshBtn">🔄 Refresh</button>
        </div>
    </div>

    <script>
        const statusText = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const form = document.getElementById('senderForm');

        let statusInterval = null;

        async function fetchStatus() {
            try {
                const res = await fetch('/status');
                const data = await res.json();
                updateStatus(data);
            } catch (e) {
                console.error('Status fetch error:', e);
            }
        }

        function updateStatus(data) {
            const badge = data.is_running 
                ? '<span class="badge badge-running">RUNNING</span>' 
                : '<span class="badge badge-stopped">STOPPED</span>';
            statusText.innerHTML = `Status: ${data.status} ${badge}`;
            startBtn.disabled = data.is_running;
            stopBtn.disabled = !data.is_running;
        }

        startBtn.addEventListener('click', async () => {
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const formData = new FormData(form);
            statusText.innerText = "Starting...";
            startBtn.disabled = true;

            try {
                const res = await fetch('/start', { method: 'POST', body: formData });
                const data = await res.json();
                alert(data.message);
                if (data.status === 'success') {
                    if (statusInterval) clearInterval(statusInterval);
                    statusInterval = setInterval(fetchStatus, 3000);
                } else {
                    startBtn.disabled = false;
                }
            } catch (e) {
                alert('Network error: ' + e.message);
                startBtn.disabled = false;
            }
            fetchStatus();
        });

        stopBtn.addEventListener('click', async () => {
            stopBtn.disabled = true;
            statusText.innerText = "Stopping...";
            try {
                const res = await fetch('/stop', { method: 'POST' });
                const data = await res.json();
                alert(data.message);
                if (statusInterval) {
                    clearInterval(statusInterval);
                    statusInterval = null;
                }
            } catch (e) {
                alert('Network error: ' + e.message);
            }
            fetchStatus();
        });

        refreshBtn.addEventListener('click', fetchStatus);
        fetchStatus();
    </script>
</body>
</html>
